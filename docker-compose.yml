services:
  nginx:
    image: nginx:alpine
    container_name: libreaudiopro_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - libreaudiopro_network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: libreaudiopro_php
    volumes:
      - ./:/var/www/html
    environment:
      - DATABASE_URL=mysql://libreaudiopro:libreaudiopro_pass@mysql:3306/libreaudiopro?encoding=utf8mb4
      - SECURITY_SALT=${SECURITY_SALT:-your_security_salt_here_change_in_production}
    depends_on:
      - mysql
    networks:
      - libreaudiopro_network

  mysql:
    image: mysql:8.0
    container_name: libreaudiopro_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: libreaudiopro
      MYSQL_USER: libreaudiopro
      MYSQL_PASSWORD: libreaudiopro_pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - libreaudiopro_network

volumes:
  mysql_data:

networks:
  libreaudiopro_network:
    driver: bridge
