name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'android-app/package-lock.json'

      - name: Install Ionic CLI and Capacitor
        run: |
          npm install -g @ionic/cli @capacitor/cli

      - name: Install dependencies
        working-directory: ./android-app
        run: npm ci

      - name: Build web app
        working-directory: ./android-app
        run: npm run build

      - name: Sync Capacitor
        working-directory: ./android-app
        run: |
          npx cap sync android

      - name: Make gradlew executable
        working-directory: ./android-app/android
        run: chmod +x ./gradlew

      - name: Build APK
        working-directory: ./android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Sign APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        working-directory: ./android-app/android
        run: |
          # Aquí puedes agregar el proceso de firma si tienes keystore
          echo "APK Debug generado"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: libreaudio-pro-debug
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android-app/android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
